name: Build and publish Windows release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release-windows.yml, package.json, package-lock.json]
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read version from package.json
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=v$version" >> $env:GITHUB_ENV
          gh release view "v$version" *> $null
          # Each version gets its own release; an existing one is never overwritten.
          "RELEASE_EXISTS=$([int]($LASTEXITCODE -eq 0))" >> $env:GITHUB_ENV
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Skip when this version is already released
        if: env.RELEASE_EXISTS == '1'
        run: echo "::notice::${{ env.TAG }} 릴리즈가 이미 있어서 덮어쓰지 않습니다. 새로 올리려면 package.json의 version을 올리세요."
      - name: Verify Korean text and build completion
        if: env.RELEASE_EXISTS != '1'
        run: node --test test/java-runtime.test.cjs test/build-button.test.cjs
      - name: Build portable EXE
        if: env.RELEASE_EXISTS != '1'
        run: npm run package:exe
      - name: Verify standalone launch
        if: env.RELEASE_EXISTS != '1'
        shell: pwsh
        run: |
          foreach ($source in @('renderer.js', 'java-runtime.cjs')) {
            $expected = (Get-FileHash $source -Algorithm SHA256).Hash
            $packaged = Join-Path 'dist/KTalkThemeStudio-win32-x64/resources/app' $source
            if ((Get-FileHash $packaged -Algorithm SHA256).Hash -ne $expected) { throw "Packaged source differs: $source" }
          }
          $exe = Resolve-Path "dist/release/Kongeuni-KT-Maker-$env:VERSION-windows-x64.exe"
          $env:KTALK_CAPTURE = Join-Path $env:RUNNER_TEMP 'portable-launch.png'
          $env:KTALK_TEST_DATA = Join-Path $env:RUNNER_TEMP 'ktmaker-test-data'
          Start-Process -FilePath $exe -WorkingDirectory $env:RUNNER_TEMP -WindowStyle Hidden
          $deadline = (Get-Date).AddSeconds(120)
          while (!(Test-Path $env:KTALK_CAPTURE) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (!(Test-Path $env:KTALK_CAPTURE)) { throw 'Portable EXE failed to render the editor.' }
          if ((Get-Item $env:KTALK_CAPTURE).Length -lt 10000) { throw 'Editor screenshot is unexpectedly small.' }
      - name: Publish a new release for this version
        if: env.RELEASE_EXISTS != '1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = "dist/release/Kongeuni-KT-Maker-$env:VERSION-windows-x64.exe"
          $notes = 'Windows 포터블 배포본입니다. EXE 하나를 내려받아 실행하세요. 설치나 ZIP 압축 해제가 필요 없습니다. 첫 실행 시 내부 파일 추출에 잠시 시간이 걸릴 수 있습니다. APK 생성에는 JDK 21과 Android SDK Platform 35 / Build Tools 35.0.0이 필요합니다.'
          gh release create $env:TAG $exe --target '${{ github.sha }}' --title "Kongeuni KT Maker $env:TAG" --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
