name: Build and publish Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-windows.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows application
        run: npm run package

      - name: Verify packaged files
        shell: pwsh
        run: |
          $app = "dist/KTalkThemeStudio-win32-x64/KTalkThemeStudio.exe"
          if (-not (Test-Path -LiteralPath $app)) { throw "Packaged executable was not created: $app" }
          $logo = "dist/KTalkThemeStudio-win32-x64/resources/app/assets/app-logo.png"
          if (-not (Test-Path -LiteralPath $logo)) { throw "Application logo was not included: $logo" }

      - name: Create ZIP and checksum
        shell: pwsh
        run: |
          $zip = "Kongeuni-KT-Maker-v0.1.0-windows-x64.zip"
          Compress-Archive -LiteralPath "dist/KTalkThemeStudio-win32-x64" -DestinationPath $zip -CompressionLevel Optimal
          (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant() + "  " + $zip | Set-Content -Encoding ascii "Kongeuni-KT-Maker-v0.1.0-windows-x64.sha256"

      - name: Publish v0.1.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 "Kongeuni-KT-Maker-v0.1.0-windows-x64.zip" "Kongeuni-KT-Maker-v0.1.0-windows-x64.sha256" --target "${{ github.sha }}" --title "Kongeuni KT Maker v0.1.0" --notes "첫 Windows 배포본입니다. ZIP을 푼 뒤 KTalkThemeStudio.exe를 실행하세요. 실행 파일만 분리하지 말고 폴더 전체를 함께 사용해야 합니다. APK 생성에는 JDK 21과 Android SDK Platform 35 / Build Tools 35.0.0이 필요합니다."
